name: Meta-Stamp Pockets
description: >
  Attribution and settlement infrastructure for AI agent content access over
  HTTP 402 and MCP. Agents pay per pull from creator-priced libraries — $1.00
  default, configurable per asset. 85% of every pull goes to the creator
  automatically, and every access attempt lands in an immutable ledger.

startCommand:
  type: http
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: Your Meta-Stamp Pockets API key (format: pkt_...)
    required: []
  exampleConfig:
    apiKey: ""
  url: https://metastampv3-production.up.railway.app/mcp
