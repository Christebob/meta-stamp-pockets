name: Meta-Stamp Pockets
description: >
  Licensing and receipts for AI agent access to creator content. Every visit
  goes on the record: a licensed pull returns the content with a receipt, a
  refused one returns a receipt that says no, and the owner's ledger gets the
  same entry. The owner sets the price, per asset.

startCommand:
  type: http
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Your Meta-Stamp Pockets API key (format: pkt_...). Get one at https://app.meta-stamp.com/customer-signup"
    required: []
  exampleConfig:
    apiKey: ""
  url: https://metastampv3-production.up.railway.app/mcp
